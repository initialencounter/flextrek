name: Publish flextrek

on:
  workflow_dispatch:

jobs:
  publish-crate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: katyo/publish-crates@v2
        with:
          path: 'flextrek'
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}